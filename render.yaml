databases:
  - name: restroweb-db
    plan: free
    databaseName: restroweb
    user: restroweb
    region: singapore

services:
  - type: web
    name: restroweb-in
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py bootstrap_admin
    startCommand: python -m gunicorn restro_project.wsgi:application
    autoDeploy: true
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: restroweb-db
          property: connectionString
      - key: RESTAURANT_WHATSAPP_NUMBER
        value: "919005954928"
      - key: DJANGO_ADMIN_USERNAME
        value: restaurantadmin
      - key: DJANGO_ADMIN_PASSWORD
        generateValue: true

